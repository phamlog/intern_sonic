| **Task** | Tương tự Fixlet nhưng do administrator tạo cho tác vụ tùy chỉnh (cài phần mềm, thay đổi cấu hình). |
| **Baseline** | Tập hợp nhiều Fixlet/Task gom thành một gói triển khai, đảm bảo endpoint nhận toàn bộ nội dung cần thiết. |
| **Action** | Hành động triển khai (deployment) Fixlet/Task/Baseline xuống endpoint với các tham số (target, schedule, reboot policy). |
| **Relevance** | Biểu thức logic đánh giá trên endpoint để xác định Fixlet/Task có áp dụng hay không. Chạy cục bộ trên agent. |
| **Action Script** | Ngôn ngữ thực thi thay đổi trên endpoint (cài phần mềm, sửa registry, xóa file, restart service). |
| **Site** | Nguồn nội dung Fixlet. External site do HCL cung cấp (Patches for Windows, CIS Compliance). Custom site do administrator tạo. |
| **Operator** | Tài khoản quản trị trong BigFix, có quyền hạn khác nhau (Master Operator, Non-Master Operator). |
| **Relay** | Thành phần trung gian cache nội dung, phân phối bản vá/phần mềm và gom báo cáo từ agent, giảm tải cho Root Server. |
| **Client/Agent** | Phần mềm cài trên endpoint, tự đánh giá relevance, thực thi action và báo cáo kết quả. |
| **Web Reports** | Thành phần tạo báo cáo web-based, cho phép nhiều người xem báo cáo qua trình duyệt. |
| **WebUI** | Giao diện quản trị web hiện đại thay thế một phần Console truyền thống. |
| **Analysis** | Đối tượng thu thập property tùy chỉnh từ endpoint (ví dụ: RAM size, last boot time, installed browsers). |
| **Property** | Thuộc tính được thu thập từ endpoint thông qua Relevance expression trong Analysis. |
| **Computer Group** | Nhóm endpoint theo tiêu chí tĩnh (chọn thủ công) hoặc động (Relevance expression tự động lọc). |
| **Deployment** | Quá trình triển khai Fixlet/Task/Baseline xuống endpoint thông qua Action. |
| **Compliance Checklist** | Bộ kiểm tra cấu hình bảo mật theo tiêu chuẩn (CIS, STIG, PCI-DSS), mỗi checklist gồm nhiều check item. |

## 13.4 Checklist triển khai BigFix

**Giai đoạn 1 – Khảo sát và thiết kế (2-4 tuần)**

- [ ] Khảo sát hạ tầng hiện tại: số lượng endpoint theo OS, vị trí địa lý, cấu trúc mạng
- [ ] Xác định số lượng endpoint cần quản lý và dự kiến tăng trưởng
- [ ] Xác định các module cần triển khai (Lifecycle, Compliance, Inventory, Remote Control)
- [ ] Thiết kế server: sizing CPU, RAM, disk dựa trên số endpoint
- [ ] Thiết kế database: SQL Server edition, disk layout, backup strategy
- [ ] Thiết kế relay: xác định vị trí relay, số lượng, relay cấp bao nhiêu
- [ ] Xác định firewall port cần mở (TCP 52311 giữa các thành phần, UDP 52311 cho notification)
- [ ] Thiết kế DMZ Relay cho endpoint remote (nếu cần)
- [ ] Xác định authentication và authorization model (LDAP, AD integration)
- [ ] Lên kế hoạch deployment agent (GPO, SCCM, script, manual)

**Giai đoạn 2 – Cài đặt (1-2 tuần)**

- [ ] Cài đặt OS và SQL Server trên máy chủ
- [ ] Cài đặt BigFix Root Server
- [ ] Cấu hình database và kiểm tra kết nối
- [ ] Cài đặt BigFix Console trên máy quản trị
- [ ] Cài đặt BigFix WebUI
- [ ] Cài đặt Relay tại các vị trí đã thiết kế
- [ ] Cấu hình DMZ Relay (nếu có)
- [ ] Mở firewall port và kiểm tra kết nối giữa các thành phần
- [ ] Đăng ký Fixlet Site cần thiết (Patches for Windows, Patches for Red Hat, CIS Compliance, v.v.)
- [ ] Đồng bộ content site và xác nhận nội dung đã tải thành công

**Giai đoạn 3 – Deploy Agent và cấu hình (2-4 tuần)**

- [ ] Deploy agent cho nhóm pilot (50-100 máy)
- [ ] Kiểm tra agent kết nối thành công với server/relay
- [ ] Phân quyền operator (Master Operator, Non-Master Operator với scope giới hạn)
- [ ] Tạo Computer Group (theo OS, vị trí, phòng ban, chức năng)
- [ ] Kiểm thử patch deployment trên nhóm pilot
- [ ] Kiểm thử software deployment trên nhóm pilot
- [ ] Kiểm thử compliance check trên nhóm pilot
- [ ] Deploy agent cho toàn bộ endpoint (theo đợt, 500-1000 máy/đợt)
- [ ] Xác nhận tất cả agent report thành công

**Giai đoạn 4 – Vận hành và bàn giao (1-2 tuần)**

- [ ] Thiết lập dashboard và báo cáo
- [ ] Cấu hình maintenance window cho patch deployment
- [ ] Tạo Baseline cho monthly patching
- [ ] Thiết lập auto-remediation cho compliance critical rules
- [ ] Đào tạo đội ngũ vận hành: Console, WebUI, Relevance cơ bản, troubleshoot agent
- [ ] Tạo tài liệu vận hành nội bộ (runbook)
- [ ] Bàn giao hệ thống cho đội vận hành

## 13.5 Checklist vận hành

**Hằng ngày:**

- [ ] Kiểm tra dashboard tổng quan: số endpoint online, agent health
- [ ] Xem danh sách endpoint không report > 24 giờ
- [ ] Kiểm tra action đang chạy: có action fail bất thường không
- [ ] Xem cảnh báo mới từ compliance module
- [ ] Xử lý ticket liên quan đến endpoint (helpdesk escalation)

**Hằng tuần:**

- [ ] Review patch compliance percentage
- [ ] Kiểm tra relay health: tất cả relay online, cache usage bình thường
- [ ] Review deployment report: action nào fail nhiều, nguyên nhân
- [ ] Kiểm tra agent version: có agent cũ cần update không
- [ ] Review computer group membership: có máy mới chưa vào đúng group

**Hằng tháng:**

- [ ] Chạy database maintenance (index rebuild, statistics update)
- [ ] Review và cleanup action cũ (archive hoặc delete)
- [ ] Review Fixlet site subscriptions: có site mới cần đăng ký
- [ ] Review operator permissions và audit log
- [ ] Tạo báo cáo tháng cho management (patch compliance, security posture, inventory changes)
- [ ] Kiểm tra backup database và test restore

**Sau Patch Tuesday (thứ Ba tuần thứ hai hàng tháng):**

- [ ] Chờ BigFix đồng bộ Fixlet mới (thường 24-48 giờ)
- [ ] Review danh sách bản vá mới: critical, important
- [ ] Tạo deployment cho nhóm Pilot
- [ ] Theo dõi kết quả Pilot trong 24-48 giờ
- [ ] Nếu không có vấn đề, tạo deployment cho Production
- [ ] Theo dõi tỷ lệ compliance trong 7 ngày
- [ ] Xử lý endpoint fail: investigate, retry, manual fix

**Khi có CVE Critical (zero-day hoặc actively exploited):**

- [ ] Kiểm tra BigFix đã có Fixlet cho CVE chưa
- [ ] Nếu có: triển khai khẩn cấp cho toàn bộ endpoint (bypass maintenance window)
- [ ] Nếu chưa: áp dụng mitigation bằng Action Script (disable feature, change config) trong khi chờ Fixlet
- [ ] Theo dõi tỷ lệ remediation mỗi giờ
- [ ] Báo cáo cho CISO về tiến độ

**Khi endpoint không report:**

- [ ] Kiểm tra endpoint có online trên mạng không (ping, AD last logon)
- [ ] Kiểm tra relay mà endpoint kết nối: relay có hoạt động không
- [ ] Kiểm tra firewall: port 52311 có bị block không
- [ ] Kiểm tra agent service trên endpoint: BESClient service có đang chạy không
- [ ] Restart agent service nếu cần
- [ ] Reinstall agent nếu agent bị corrupt

**Khi action fail:**

- [ ] Xem chi tiết lỗi trong action results trên Console
- [ ] Kiểm tra agent log trên endpoint: C:\Program Files (x86)\BigFix Enterprise\BES Client\__BESData\__Global\Logs
- [ ] Nguyên nhân phổ biến: file download fail (network issue), installer fail (dependency missing, disk full), reboot pending from previous action
- [ ] Retry action hoặc tạo action mới với parameters điều chỉnh

    </script>

    <script>
        // Global Variables
        let treeData = [];
        let flatData = [];
        let currentNodeIndex = -1;
        let zoomLevel = 1;
        let MARKDOWN_CONTENT = '';

        // Load markdown from embedded script tag
        function loadMarkdown() {
            const scriptTag = document.getElementById('markdown-data');
            MARKDOWN_CONTENT = scriptTag.textContent.trim();
            console.log('Loaded markdown:', MARKDOWN_CONTENT.length, 'characters');
        }

        // Parse Markdown into Tree Structure
        function parseMarkdown(content) {
            const lines = content.split('\n');
            const tree = [];
            const stack = [{ level: 0, children: tree }];
            let currentNode = null;
            let currentContent = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const h6Match = line.match(/^###### (.+)/);
                const h5Match = line.match(/^##### (.+)/);
                const h4Match = line.match(/^#### (.+)/);
                const h3Match = line.match(/^### (.+)/);
                const h2Match = line.match(/^## (.+)/);
                const h1Match = line.match(/^# (.+)/);

                let level = 0;
                let title = null;

                if (h6Match) { level = 6; title = h6Match[1]; }
                else if (h5Match) { level = 5; title = h5Match[1]; }
                else if (h4Match) { level = 4; title = h4Match[1]; }
                else if (h3Match) { level = 3; title = h3Match[1]; }
                else if (h2Match) { level = 2; title = h2Match[1]; }
                else if (h1Match) { level = 1; title = h1Match[1]; }

                if (title) {
                    if (currentNode) {
                        currentNode.content = currentContent.join('\n').trim();
                        currentContent = [];
                    }
                    const node = { id: `node-${i}`, title: title, level: level, children: [], content: '', lineNumber: i };
                    while (stack.length > 1 && stack[stack.length - 1].level >= level) { stack.pop(); }
                    stack[stack.length - 1].children.push(node);
                    stack.push({ level: level, children: node.children });
                    currentNode = node;
                    currentContent.push(line);
                } else {
                    currentContent.push(line);
                }
            }
            if (currentNode) { currentNode.content = currentContent.join('\n').trim(); }
            return tree;
        }

        function flattenTree(nodes, result = [], parentPath = []) {
            nodes.forEach((node, index) => {
                const path = [...parentPath, index];
                result.push({ ...node, path: path, parentPath: parentPath });
                if (node.children && node.children.length > 0) { flattenTree(node.children, result, path); }
            });
            return result;
        }

        function renderTree(nodes, parentElement, parentPath = []) {
            nodes.forEach((node, index) => {
                const li = document.createElement('li');
                li.style.listStyle = 'none';
                const label = document.createElement('div');
                label.className = 'tree-node-label';
                label.dataset.nodeId = node.id;
                label.dataset.path = JSON.stringify([...parentPath, index]);
                const icon = document.createElement('span');
                icon.className = 'tree-node-icon';
                icon.textContent = node.children.length > 0 ? '▶' : '•';
                label.appendChild(icon);
                const text = document.createElement('span');
                text.className = 'tree-node-text';
                text.textContent = node.title;
                label.appendChild(text);
                if (node.children.length > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'tree-node-badge';
                    badge.textContent = node.children.length;
                    label.appendChild(badge);
                }
                label.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (node.children.length > 0) {
                        icon.classList.toggle('expanded');
                        const childrenUl = li.querySelector('.tree-node-children');
                        if (childrenUl) { childrenUl.classList.toggle('collapsed'); }
                    }
                    showNodeContent(node, [...parentPath, index]);
                    document.querySelectorAll('.tree-node-label').forEach(l => l.classList.remove('active'));
                    label.classList.add('active');
                });
                li.appendChild(label);
                if (node.children.length > 0) {
                    const childrenUl = document.createElement('ul');
                    childrenUl.className = 'tree-node-children collapsed';
                    renderTree(node.children, childrenUl, [...parentPath, index]);
                    li.appendChild(childrenUl);
                }
                parentElement.appendChild(li);
            });
        }

        function showNodeContent(node, path) {
            const contentArea = document.getElementById('contentArea');
            const metadataBar = document.getElementById('metadataBar');
            const navigation = document.getElementById('navigation');
            document.getElementById('nodeLevel').textContent = `H${node.level}`;
            let parentNode = null;
            if (path.length > 1) {
                let current = treeData;
                for (let i = 0; i < path.length - 1; i++) { current = current[path[i]].children; }
                parentNode = current.length > 0 ? treeData : null;
            }
            document.getElementById('nodeParent').textContent = parentNode ? 'Yes' : 'Root';
            document.getElementById('nodeChildren').textContent = node.children.length;
            metadataBar.style.display = 'flex';
            updateBreadcrumb(path);
            const contentHtml = `<div class="content-markdown">${convertMarkdownToHTML(node.content)}</div>`;
            contentArea.innerHTML = contentHtml;
            contentArea.scrollTop = 0;
            currentNodeIndex = flatData.findIndex(n => n.id === node.id);
            navigation.style.display = 'flex';
            document.getElementById('prevBtn').disabled = currentNodeIndex === 0;
            document.getElementById('nextBtn').disabled = currentNodeIndex === flatData.length - 1;
        }

        function convertMarkdownToHTML(markdown) {
            let html = markdown;
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const escapedCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre><code class="language-${lang}">${escapedCode}</code></pre>`;
            });
            html = html.replace(/`([^`]+)`/g, (match, code) => { return `<code>${code}</code>`; });
            html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
            html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
            html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
            html = html.replace(/^---+$/gm, '<hr>');
            html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');
            const tableRegex = /(\|.+\|[\r\n]+)+/g;
            html = html.replace(tableRegex, (match) => {
                const rows = match.trim().split('\n').filter(r => r.trim() && !r.match(/^\|[\s\-:]+\|$/));
                if (rows.length === 0) return match;
                let tableHtml = '<table>';
                rows.forEach((row, idx) => {
                    const cells = row.split('|').filter(c => c.trim()).map(c => c.trim());
                    const tag = idx === 0 ? 'th' : 'td';
                    tableHtml += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
                });
                tableHtml += '</table>';
                return tableHtml;
            });
            const ulRegex = /^[\*\-]\s+(.+)$/gm;
            html = html.replace(ulRegex, '<li>$1</li>');
            const olRegex = /^\d+\.\s+(.+)$/gm;
            html = html.replace(olRegex, '<li>$1</li>');
            html = html.replace(/(<li>.*?<\/li>\s*)+/gs, (match) => { return '<ul>' + match + '</ul>'; });
            const parts = html.split('\n\n');
            html = parts.map(part => {
                part = part.trim();
                if (part && !part.startsWith('<h') && !part.startsWith('<ul') && !part.startsWith('<ol') && !part.startsWith('<pre') && !part.startsWith('<table') && !part.startsWith('<hr') && !part.startsWith('<blockquote') && !part.startsWith('<li')) {
                    return '<p>' + part.replace(/\n/g, '<br>') + '</p>';
                }
                return part;
            }).join('\n');
            return html;
        }

        function updateBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = '';
            const homeItem = document.createElement('span');
            homeItem.className = 'breadcrumb-item';
            homeItem.textContent = '🏠 Home';
            homeItem.onclick = () => {
                document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📄</div><div class="empty-state-title">HCL BigFix Knowledge Tree</div><div class="empty-state-text">Chọn một mục từ cây bên trái</div></div>';
                document.getElementById('metadataBar').style.display = 'none';
                document.getElementById('navigation').style.display = 'none';
                document.querySelectorAll('.tree-node-label').forEach(l => l.classList.remove('active'));
            };
            breadcrumb.appendChild(homeItem);
            let current = treeData;
            path.forEach((index, i) => {
                const separator = document.createElement('span');
                separator.className = 'breadcrumb-separator';
                separator.textContent = '›';
                breadcrumb.appendChild(separator);
                const node = current[index];
                const item = document.createElement('span');
                item.className = i === path.length - 1 ? 'breadcrumb-item active' : 'breadcrumb-item';
                item.textContent = node.title;
                if (i < path.length - 1) {
                    item.onclick = () => { const nodePath = path.slice(0, i + 1); showNodeContent(node, nodePath); };
                }
                breadcrumb.appendChild(item);
                current = node.children;
            });
        }

        let searchTimeout = null;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    document.querySelectorAll('.tree-node-label').forEach(label => {
                        label.style.display = 'flex';
                        label.parentElement.style.display = 'list-item';
                    });
                    return;
                }
                let matchCount = 0;
                flatData.forEach(node => {
                    const label = document.querySelector(`[data-node-id="${node.id}"]`);
                    if (label) {
                        const titleMatch = node.title.toLowerCase().includes(query);
                        const contentMatch = node.content.toLowerCase().includes(query);
                        if (titleMatch || contentMatch) {
                            label.style.display = 'flex';
                            label.parentElement.style.display = 'list-item';
                            let parentPath = node.parentPath;
                            if (parentPath && parentPath.length > 0) {
                                let tempPath = [];
                                parentPath.forEach(idx => {
                                    tempPath.push(idx);
                                    const parentLabel = document.querySelector(`[data-path="${JSON.stringify(tempPath)}"]`);
                                    if (parentLabel) {
                                        const icon = parentLabel.querySelector('.tree-node-icon');
                                        if (icon) icon.classList.add('expanded');
                                        const childrenUl = parentLabel.parentElement.querySelector('.tree-node-children');
                                        if (childrenUl) childrenUl.classList.remove('collapsed');
                                    }
                                });
                            }
                            matchCount++;
                        } else {
                            label.style.display = 'none';
                            label.parentElement.style.display = 'none';
                        }
                    }
                });
                console.log(`Found ${matchCount} matches`);
            }, 300);
        });

        function expandAll() {
            document.querySelectorAll('.tree-node-icon').forEach(icon => { icon.classList.add('expanded'); });
            document.querySelectorAll('.tree-node-children').forEach(children => { children.classList.remove('collapsed'); });
        }

        function collapseAll() {
            document.querySelectorAll('.tree-node-icon').forEach(icon => { icon.classList.remove('expanded'); });
            document.querySelectorAll('.tree-node-children').forEach(children => { children.classList.add('collapsed'); });
        }

        function navigatePrev() {
            if (currentNodeIndex > 0) {
                const prevNode = flatData[currentNodeIndex - 1];
                showNodeContent(prevNode, prevNode.path);
                const label = document.querySelector(`[data-node-id="${prevNode.id}"]`);
                if (label) {
                    document.querySelectorAll('.tree-node-label').forEach(l => l.classList.remove('active'));
                    label.classList.add('active');
                    label.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function navigateNext() {
            if (currentNodeIndex < flatData.length - 1) {
                const nextNode = flatData[currentNodeIndex + 1];
                showNodeContent(nextNode, nextNode.path);
                const label = document.querySelector(`[data-node-id="${nextNode.id}"]`);
                if (label) {
                    document.querySelectorAll('.tree-node-label').forEach(l => l.classList.remove('active'));
                    label.classList.add('active');
                    label.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function zoomIn() { zoomLevel = Math.min(zoomLevel + 0.1, 2); applyZoom(); }
        function zoomOut() { zoomLevel = Math.max(zoomLevel - 0.1, 0.5); applyZoom(); }
        function resetZoom() { zoomLevel = 1; applyZoom(); }
        function applyZoom() { document.getElementById('contentArea').style.fontSize = `${zoomLevel}em`; }

        function setViewMode(mode) {
            const sidebar = document.getElementById('sidebar');
            const contentPanel = document.getElementById('contentPanel');
            document.querySelectorAll('.view-toggle-btn').forEach(btn => { btn.classList.remove('active'); });
            event.target.classList.add('active');
            switch(mode) {
                case 'tree': sidebar.style.width = '100%'; contentPanel.style.display = 'none'; break;
                case 'document': sidebar.style.display = 'none'; contentPanel.style.width = '100%'; break;
                case 'split': default: sidebar.style.display = 'flex'; sidebar.style.width = '400px'; contentPanel.style.display = 'flex'; contentPanel.style.width = 'auto'; break;
            }
        }


        function init() {
            try {
                console.log('=== INIT START ===');
                console.log('Step 1: Loading markdown...');
                loadMarkdown();
                console.log('Step 2: Markdown loaded, length:', MARKDOWN_CONTENT.length);
                
                if (!MARKDOWN_CONTENT || MARKDOWN_CONTENT.length === 0) {
                    throw new Error('Markdown content is empty!');
                }
                
                console.log('Step 3: Parsing markdown...');
                treeData = parseMarkdown(MARKDOWN_CONTENT);
                console.log('Step 4: Tree parsed, root nodes:', treeData.length);
                
                if (treeData.length === 0) {
                    throw new Error('No tree nodes found! Check markdown parsing.');
                }
                
                console.log('Step 5: Flattening tree...');
                flatData = flattenTree(treeData);
                console.log('Step 6: Flattened, total nodes:', flatData.length);
                
                console.log('Step 7: Getting tree container...');
                const treeContainer = document.getElementById('knowledgeTree');
                console.log('Step 8: Tree container found:', !!treeContainer);
                
                if (!treeContainer) {
                    throw new Error('Tree container element not found!');
                }
                
                console.log('Step 9: Rendering tree...');
                renderTree(treeData, treeContainer);
                console.log('Step 10: Tree rendered!');
                console.log('=== INIT SUCCESS ===');
            } catch (error) {
                console.error('=== INIT ERROR ===');
                console.error('Error:', error.message);
                console.error('Stack:', error.stack);
                document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Lỗi tải dữ liệu</div><div class="empty-state-text">' + error.message + '<br><br>Mở Console (F12) để xem chi tiết</div></div>';
            }
        }

        console.log('Script loaded, waiting for DOM...');
        if (document.readyState === 'loading') { 
            console.log('DOM still loading, adding event listener...');
            document.addEventListener('DOMContentLoaded', init); 
        } else { 
            console.log('DOM already loaded, calling init immediately...');
            init(); 
        }
    </script>
</body>
